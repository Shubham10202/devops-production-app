name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile app/app.py

      - name: Build Docker image
        run: |
          docker build -t devops-production-app:ci .

      - name: Run container
        run: |
          docker run -d \
            --name ci-app \
            -p 8080:8080 \
            -e APP_ENV=production \
            -e APP_PORT=8080 \
            devops-production-app:ci

      - name: Wait for application
        run: |
          sleep 5

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8080/health

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag devops-production-app:ci ghcr.io/shubham10202/devops-production-app:latest
          docker tag devops-production-app:ci ghcr.io/shubham10202/devops-production-app:${{ github.sha }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/shubham10202/devops-production-app:latest
          docker push ghcr.io/shubham10202/devops-production-app:${{ github.sha }}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-app || true
