name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init for pull request
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate for pull request
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: terraform validate

      - name: Configure AWS credentials for Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::191239450128:role/GitHubActions-Terraform-Plan
          aws-region: ap-south-1
          role-session-name: GitHubActions-Terraform-Plan

      - name: Terraform init
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform plan -input=false -no-color

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile app/app.py

      - name: Build Docker image
        run: |
          docker build -t devops-production-app:ci .

      - name: Run container
        run: |
          docker run -d \
            --name ci-app \
            -p 8080:8080 \
            -e APP_ENV=production \
            -e APP_PORT=8080 \
            devops-production-app:ci

      - name: Wait for application
        run: |
          sleep 5

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8080/health

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-production-app:ci ghcr.io/shubham10202/devops-production-app:latest
          docker tag devops-production-app:ci ghcr.io/shubham10202/devops-production-app:${{ github.sha }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/shubham10202/devops-production-app:latest
          docker push ghcr.io/shubham10202/devops-production-app:${{ github.sha }}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-app || true
