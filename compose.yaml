services:
  app:
    build: .
    container_name: devops-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_PORT: "8080"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 5s
